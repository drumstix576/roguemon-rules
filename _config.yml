# RogueMon rules site. Content is generated from README.md (single source of
# truth); see BUILDING.md (added once the structure is finalized).
title: RogueMon
theme: just-the-docs

# Firm requirement: dark by default.
color_scheme: dark

# Sidebar logo (top-left). Responsive fallback to the square R mark is in
# _sass/custom/custom.scss; favicon (the R mark) is in _includes/head_custom.html.
logo: "/RoguemonLogo.png"

# Set per environment at build time, e.g.:
#   --baseurl "" (root)   or via JEKYLL prod config.
url: ""
baseurl: ""

# Just the Docs options
search_enabled: true
heading_anchors: true

# Featured links: Play + Leaderboard pinned top-right on every page.
aux_links:
  "Play RogueMon": "https://crozwords.itch.io/roguemon"
  "RogueMon Leaderboard": "https://www.roguemon.gg/"
aux_links_new_tab: true

# Featured links: Twitch / YouTube / Discord render as icons in the footer,
# via _includes/footer_custom.html.

# Files that are not site content.
exclude:
  - README.md
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
