# Usage (gems are baked into the image, so no bundle install step is needed):
#   docker compose build                                       # build the image (installs gems)
#   docker compose up                                          # serve at http://localhost:4000/
#   docker compose run --rm jekyll bundle exec jekyll build    # static build into _site/
services:
  jekyll:
    build: .
    working_dir: /site
    ports:
      - "4000:4000"
    volumes:
      - .:/site
    environment:
      JEKYLL_ENV: development
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling
