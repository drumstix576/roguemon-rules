# Usage:
#   docker compose run --build --rm jekyll bundle install      # resolve gems (writes Gemfile.lock)
#   docker compose up                                          # serve at http://localhost:4000/
#   docker compose run --rm jekyll bundle exec jekyll build    # one-off static build into _site/
services:
  jekyll:
    build: .
    working_dir: /site
    ports:
      - "4000:4000"
    volumes:
      - .:/site
      - gems:/usr/local/bundle
    environment:
      JEKYLL_ENV: development
    command: sh -c "bundle check || bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"

volumes:
  gems:
